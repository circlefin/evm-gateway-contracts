name: pipeline
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: block
          policy: global-allowed-endpoints-policy

      - name: Check out repository code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          submodules: 'recursive'

      - name: Install jq
        run: sudo apt update && sudo apt install -y jq

      - name: Install Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '22.10.0'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e # v1.5.0
        with:
          version: 'v1.0.0'

      - name: Install npm dependencies
        run: yarn install

      - name: Check formatting
        run: yarn format

      - name: Lint
        run: yarn lint

      - name: Ensure artifacts haven't changed
        run: |
          yarn artifacts
          if [ -n "$(git status --porcelain)" ]; then
            echo "Artifacts have changed, please commit the changes.";
            exit 1;
          fi

      - name: Check contract sizes
        run: yarn sizes

      - name: Run tests
        run: yarn test:all

  rollup_results:
    runs-on: small
    name: Build Success Rollup
    if: ${{ always() }}
    needs:
      - ci
    permissions:
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: block
          policy: global-allowed-endpoints-policy

      - run: |
          [ "${{ needs.ci.result }}" = "success" ] || [ "${{ needs.ci.result }}" = "skipped" ]
